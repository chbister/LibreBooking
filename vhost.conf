server {
    listen 80;
    server_name _;

    # Root der Anwendung
    root /var/www/html/Web;

    # Optional: HTTPS erzwingen
    # return 301 https://$host$request_uri;

    # Alles, was nicht /Web/ beginnt → weiterleiten
    location / {
        # wenn der Request nicht bereits /Web/... ist:
        if ($request_uri !~ "^/Web(/|$)") {
            return 301 /Web$uri;
        }

        try_files $uri $uri/ /index.php?$args;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass php-fpm:9000;  # hängt davon ab, wie dein Container heißt
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Optional: CORS
    # add_header Access-Control-Allow-Origin "*";
    # add_header Access-Control-Allow-Headers "origin, x-requested-with, content-type";
    # add_header Access-Control-Allow-Methods "PUT, GET, POST, DELETE, OPTIONS";

    # Für OPTIONS-Requests CORS erlauben
    # if ($request_method = OPTIONS) {
    #     add_header Access-Control-Allow-Origin "*";
    #     add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
    #     add_header Access-Control-Allow-Headers "origin, x-requested-with, content-type";
    #     return 204;
    # }
}
